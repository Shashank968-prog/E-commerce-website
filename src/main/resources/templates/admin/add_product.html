<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f0f1e;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(250, 82, 82, 0.3), transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(139, 92, 246, 0.3), transparent 50%);
            animation: gradient 15s ease infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradient {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .form-card {
            background: rgba(20, 20, 35, 0.7);
            border-radius: 30px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .form-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.6);
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 70px 50px;
        }

        .form-header h1 {
            font-size: 48px;
            font-weight: 800;
            color: white;
            margin: 0;
        }

        .form-header p {
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 17px;
        }

        .form-body {
            padding: 55px 50px;
            background: linear-gradient(to bottom, rgba(15, 15, 30, 0.95), rgba(20, 20, 35, 0.95));
        }

        .alert {
            padding: 20px 28px;
            border-radius: 16px;
            margin-bottom: 32px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .form-section {
            background: rgba(30, 30, 50, 0.5);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 32px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 18px 22px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(30, 30, 50, 0.6);
            color: #e5e7eb;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 150px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }

        .file-upload {
            border: 3px dashed rgba(102, 126, 234, 0.4);
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            background: rgba(30, 30, 50, 0.4);
            position: relative;
        }

        .file-upload input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-submit:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.7);
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>Add New Product</h1>
                <p>Enter product details to add to your inventory</p>
            </div>

            <div class="form-body">
                <!-- Success Message -->
                <div th:if="${session.succMsg != null and !session.succMsg.isEmpty()}" class="alert alert-success">
                    ✅ <span th:text="${session.succMsg}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${session.errorMsg != null and !session.errorMsg.isEmpty()}" class="alert alert-danger">
                    ❌ <span th:text="${session.errorMsg}"></span>
                </div>

                <form th:action="@{/admin/saveProduct}" method="post" enctype="multipart/form-data">

                    <!-- Basic Information -->
                    <div class="form-section">
                        <div class="section-title">Basic Information</div>
                        <div class="form-group">
                            <label class="form-label">Product Title <span class="required">*</span></label>
                            <input type="text" name="title" class="form-control" placeholder="Enter product name" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Description <span class="required">*</span></label>
                            <textarea name="description" class="form-control" placeholder="Describe the product" required></textarea>
                        </div>
                    </div>

                    <!-- Category & Pricing -->
                    <div class="form-section">
                        <div class="section-title">Category & Pricing</div>
                        <div class="form-group">
                            <label class="form-label">Category <span class="required">*</span></label>
                            <select name="category.id" class="form-control" required>
                                <option value="">Select a category</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Price (₹)</label>
                                <input type="number" name="price" class="form-control" placeholder="0.00" step="0.01" min="0" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Stock Quantity</label>
                                <input type="number" name="stock" class="form-control" placeholder="0" min="0" required>
                            </div>
                        </div>
                    </div>

                    <!-- Product Image -->
                    <div class="form-section">
                        <div class="section-title">Product Image</div>
                        <div class="file-upload">
                            <input type="file" name="file" accept="image/*" required>
                            <p>📸 Click or drag to upload image</p>
                            <p style="color: #aaa; font-size: 14px;">Supported: JPG, PNG, JPEG (Max 10MB)</p>
                        </div>
                    </div>

                    <!-- Product Status -->
                    <div class="form-section">
                        <div class="section-title">Product Status</div>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="active" name="isActive" value="true" checked>
                                <label for="active">Active</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="inactive" name="isActive" value="false">
                                <label for="inactive">Inactive</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Add Product</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
