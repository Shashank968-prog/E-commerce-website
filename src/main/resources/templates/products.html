<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Products - Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0f6d7b0.js" crossorigin="anonymous"></script>
</head>

<body>
<section>

  <!-- 🔍 Search Bar -->
  <div class="container-fluid bg-primary p-4 mt-5">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <form th:action="@{/products}" method="get">
          <div class="input-group">
            <input type="text" class="form-control" name="ch" placeholder="Search for products...">
            <button class="btn btn-light text-dark ms-3 col-md-2" type="submit">
              <i class="fa-solid fa-magnifying-glass"></i> Search
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 🧭 Categories + Products -->
  <div class="container-fluid p-5 mt-5">
    <div class="row">

      <!-- 🏷️ Categories Section -->
      <div class="col-md-2">
        <div class="list-group">
          <a href="#" class="list-group-item list-group-item-action active" aria-current="true">
            Categories
          </a>
          <a th:each="c : ${categories}"
             th:href="@{/products/category/{id}(id=${c.id})}"
             class="list-group-item list-group-item-action"
             th:text="${c.name}">
            Category Name
          </a>
        </div>
      </div>

      <!-- 🛍️ Products Section -->
      <div class="col-md-10">
        <div class="card">
          <div class="card-body">
            <p class="fs-3 text-center mb-4">Products</p>

            <div class="row">

              <!-- ✅ Product Loop -->
              <div class="col-md-3 mb-4" th:each="p : ${products}">
                <div class="card shadow h-100">
                  <div class="card-body text-center">

                    <!-- Product Image -->
                    <img th:src="@{/img/product_img/{img}(img=${p.image})}"
                         alt="Product Image" 
                         class="img-fluid" 
                         style="max-height: 150px; object-fit: cover;">

                    <!-- Product Title -->
                    <p class="fs-5 text-center mt-2" th:text="${p.title}">Product Title</p>

                    <!-- Price + Discount -->
                    <p class="fs-6 fw-bold">
                      ₹<span th:text="${p.price}">0</span>
                      <span class="fs-6 text-success" th:if="${p.discount > 0}">
                        <span th:text="${p.discount}">0</span>% off
                      </span>
                    </p>

                    <!-- View Details -->
                    <a th:href="@{/product/{id}(id=${p.id})}"
                       class="btn btn-primary col-md-8">
                      View Details
                    </a>
                  </div>
                </div>
              </div>
              <!-- ✅ End Product Loop -->

              <!-- ❌ No Products Message -->
              <div class="col-12 text-center mt-5" th:if="${products == null || products.isEmpty()}">
                <p class="fs-4 text-muted">No products available right now.</p>
              </div>

            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</section>
</body>
</html>
